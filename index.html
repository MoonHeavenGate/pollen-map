    .controls{display:flex;justify-content:center;gap:15px;padding:20px;flex-wrap:wrap}

    .month-btn:hover,.month-btn.active{background:#4a9eff;color:#fff}
    .container{display:flex;flex-wrap:wrap;justify-content:center;gap:30px;padding:20px;max-width:1400px;margin:0 auto}
    .map-section{flex:1;min-width:500px;max-width:900px}
    .china-map{background:rgba(255,255,255,0.05);border-radius:20px;padding:10px;height:500px;position:relative}
    #map{width:100%;height:100%;border-radius:15px}
    .info-section{flex:0 0 350px}
    .legend{background:rgba(255,255,255,0.08);border-radius:15px;padding:20px;margin-bottom:20px}
    .legend h3{margin-bottom:15px;font-size:16px}
    .legend-item{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
    .legend-color{width:20px;height:20px;border-radius:50%}
    .city-list{background:rgba(255,255,255,0.08);border-radius:15px;padding:20px;max-height:350px;overflow-y:auto}
    .city-list h3{margin-bottom:15px;font-size:16px}
    .city-item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(255,255,255,0.05);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .2s}
    .city-item:hover{background:rgba(255,255,255,0.1)}
    .city-name{font-weight:500}
    .city-allergens{font-size:12px;color:#888;margin-top:4px}
    .risk-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500}
    .risk-low{background:#2ed573;color:#fff}
    .risk-medium{background:#ffa502;color:#fff}
    .risk-high{background:#ff4757;color:#fff}
    .risk-very-high{background:#8b0000;color:#fff}
    .pollen-types{margin-top:20px;background:rgba(255,255,255,0.08);border-radius:15px;padding:20px}
    .pollen-types h3{margin-bottom:15px;font-size:16px}
    .pollen-item{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:8px;background:rgba(255,255,255,0.05);border-radius:8px}
    .pollen-icon{font-size:24px}
    .pollen-name{font-weight:500;font-size:14px}
    .pollen-season{font-size:12px;color:#888}
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;z-index:1000}
    .modal.active{display:flex}
    .modal-content{background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:20px;padding:30px;max-width:400px;width:90%;border:1px solid rgba(255,255,255,0.1)}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .modal-header h2{font-size:22px}
    .modal-close{background:none;border:none;color:#888;font-size:24px;cursor:pointer}
    .modal-close:hover{color:#fff}
    .modal-risk{display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;margin-bottom:15px}
    .modal-allergens{background:rgba(255,255,255,0.05);border-radius:10px;padding:15px}
    .modal-allergens h4{font-size:14px;color:#888;margin-bottom:10px}
    .allergen-tag{display:inline-block;background:rgba(74,158,255,0.2);color:#4a9eff;padding:5px 12px;border-radius:15px;font-size:13px;margin:5px 5px 5px 0}
    .modal-tips{margin-top:15px;background:rgba(255,107,107,0.1);border-radius:10px;padding:15px;border-left:3px solid #ff6b6b}
    .modal-tips h4{font-size:14px;color:#ff6b6b;margin-bottom:8px}
    .modal-tips p{font-size:13px;color:#ccc;line-height:1.6}
    .footer{text-align:center;padding:30px;color:#666;font-size:12px}
    .high-risk-cities{margin-top:15px;background:rgba(255,71,87,0.15);border-radius:10px;padding:15px;border-left:3px solid #ff4757}
    .high-risk-cities h4{font-size:14px;color:#ff4757;margin-bottom:8px}
    .loading{text-align:center;padding:50px;color:#888}
    @media(max-width:768px){.container{flex-direction:column;align-items:center}.map-section{min-width:100%}.info-section{flex:0 0 100%;width:100%}.china-map{height:400px}}

拉萨:{allergens:{spring:["杨树","柳树","沙棘"],summer:["草本花粉","霉菌"],fall:["霉菌","杂草"],winter:["室内尘螨"]},riskPattern:{spring:"medium",summer:"medium",fall:"low",winter:"low"},tips:"高原地区氧气稀薄，过敏症状可能更明显。"}
};

    const monthNames=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
    const pollenCalendar={spring:[{icon:"🌳",name:"杨树/柳树花粉",desc:"华北地区3-4月高峰"},{icon:"🌲",name:"柏树花粉",desc:"3-5月全国分布"},{icon:"🌸",name:"法国梧桐",desc:"长三角4-5月飞絮"},{icon:"🍃",name:"桦树花粉",desc:"东北4-6月高峰"}],summer:[{icon:"🌾",name:"草本花粉",desc:"北方夏季主要过敏原"},{icon:"🌻",name:"向日葵花粉",desc:"西北7-8月"},{icon:"🍂",name:"蝉翼/蝉过敏",desc:"南方夏季特有"}],fall:[{icon:"🌿",name:"蒿草花粉",desc:"北方8-10月高峰"},{icon:"🍁",name:"葎草花粉",desc:"9-10月全国分布"},{icon:"🌾",name:"豚草花粉",desc:"北方城市秋季"},{icon:"🍄",name:"霉菌孢子",desc:"秋季潮湿环境高发"}],winter:[{icon:"🏠",name:"室内尘螨",desc:"冬季门窗紧闭高发"},{icon:"🍄",name:"霉菌",desc:"冬季室内暖气诱发"},{icon:"🐛",name:"宠物皮屑",desc:"冬季室内接触增加"}]};

    // 地图变量
    let map = null;
    let cityMarkers = {};

    function getSeason(m){if(m>=3&&m<=5)return"spring";if(m>=6&&m<=8)return"summer";if(m>=9&&m<=11)return"fall";return"winter"}
    function getRiskText(r){return{low:"低风险",medium:"中风险",high:"高风险","very-high":"极高风险"}[r]}
    function getRiskClass(r){return{low:"risk-low",medium:"risk-medium",high:"risk-high","very-high":"risk-very-high"}[r]}
    function getRiskColor(r){return{low:"#2ed573",medium:"#ffa502",high:"#ff4757","very-high":"#8b0000"}[r]}

    function initMap(){
      if(map) return;
      try{
        map = L.map('map', {
          center: [35.8617, 104.1954],
          zoom: 4,
          minZoom: 4,
          maxZoom: 10
        });

        // 使用天地图（国内可访问）
        L.tileLayer('https://t0.tianditu.gov.cn/DataServer?T=vec_w&X={x}&Y={y}&L={z}&tk=your_token_here', {
          attribution: '&copy; 天地图'
        }).addTo(map);
        
        // 备用：使用OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap'
        }).addTo(map);
      }catch(e){
        console.error('地图初始化失败:', e);
        document.getElementById('map').innerHTML='<div class="loading">地图加载失败，请刷新页面</div>';
      }
    }

    function initMonthControls(){
      const c=document.getElementById("month-controls");
      const cm=new Date().getMonth()+1;
      monthNames.forEach((n,i)=>{
        const b=document.createElement("button");
        b.className="month-btn"+(i+1===cm?" active":"");
        b.textContent=n;
        b.onclick=()=>{
          document.querySelectorAll(".month-btn").forEach(x=>x.classList.remove("active"));
          b.classList.add("active");
          updateMap(i+1)
        };
        c.appendChild(b)
      })
    }

    function createMarkerIcon(color) {
      return L.divIcon({
        className: 'custom-marker',
        html: `<div style="background:${color};width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.4);"></div>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });
    }

    function updateMap(m){
      const s=getSeason(m);
      
      // 初始化地图（延迟加载）
      initMap();
      
      // 清除旧的 markers
      if(cityMarkers && Object.keys(cityMarkers).length > 0){
        Object.values(cityMarkers).forEach(marker => {
          if(marker && marker.remove) marker.remove();
        });
      }
      cityMarkers = {};
      
      // 添加新的 markers
      setTimeout(()=>{
        Object.entries(cityData).forEach(([name, data]) => {
          const coords = cityCoords[name];
          if (!coords || !map) return;
          
          try{
            const r = data.riskPattern[s];
            const color = getRiskColor(r);
            
            const marker = L.marker(coords, {
              icon: createMarkerIcon(color)
            }).addTo(map);
            
            marker.bindPopup(`
              <div style="text-align:center;min-width:150px">
                <strong style="font-size:16px">${name}</strong><br>
                <span style="display:inline-block;padding:4px 12px;border-radius:12px;background:${color};color:#fff;margin-top:6px;font-weight:bold;">${getRiskText(r)}</span><br>
                <small style="color:#666;margin-top:8px;display:block">主要过敏原：${data.allergens[s].slice(0,2).join('、')}</small>
                <button onclick="showCityDetail('${name}')" style="margin-top:10px;padding:6px 16px;background:#4a9eff;color:#fff;border:none;border-radius:6px;cursor:pointer;">查看详情</button>
              </div>
            `);
            
            cityMarkers[name] = marker;
          }catch(e){
            console.error('添加标记失败:', name, e);
          }
        });
      }, 500);
      
      updateCityList(m);
      updatePollenInfo(m);
      updateHighRiskCities(m);
    }

    function updateCityList(m){
      const s=getSeason(m);
      const c=document.getElementById("city-list-content");
      const t=document.getElementById("city-list-title");
      t.textContent=monthNames[m-1]+"全国主要城市过敏风险";
      const sorted=Object.entries(cityData).map(([n,d])=>({name:n,...d})).sort((a,b)=>{
        const o={"very-high":0,high:1,medium:2,low:3};
        return o[a.riskPattern[s]]-o[b.riskPattern[s]]
      });
      c.innerHTML=sorted.map(city=>`
        <div class="city-item" onclick="showCityDetail('${city.name}')">
          <div>
            <div class="city-name">${city.name}</div>
            <div class="city-allergens">${city.allergens[s].slice(0,2).join("、")}</div>
          </div>
          <span class="risk-badge ${getRiskClass(city.riskPattern[s])}">${getRiskText(city.riskPattern[s])}</span>
        </div>
      `).join("")
    }

    function updatePollenInfo(m){
      const s=getSeason(m);
      const c=document.getElementById("pollen-info");
      const ps=pollenCalendar[s];
      c.innerHTML=ps.map(p=>`
        <div class="pollen-item">
          <span class="pollen-icon">${p.icon}</span>
          <div>
            <div class="pollen-name">${p.name}</div>
            <div class="pollen-season">${p.desc}</div>
          </div>
        </div>
      `).join("")
    }

    function updateHighRiskCities(m){
      const s=getSeason(m);
      const c=document.getElementById("high-risk-cities");
      const content=document.getElementById("high-risk-content");
      const hr=Object.entries(cityData).filter(([,d])=>d.riskPattern[s]==="high"||d.riskPattern[s]==="very-high").map(([n])=>n);
      if(hr.length>0){
        c.style.display="block";
        content.textContent=hr.slice(0,8).join("、")
      }else{
        c.style.display="none"
      }
    }

    function showCityDetail(n){
      const city=cityData[n];
      if(!city)return;
      const s=getSeason(new Date().getMonth()+1);
      document.getElementById("modal-city-name").textContent=n;
      const mr=document.getElementById("modal-risk");
      mr.textContent=getRiskText(city.riskPattern[s]);
      mr.className="modal-risk "+getRiskClass(city.riskPattern[s]);
      document.getElementById("modal-allergens-content").innerHTML=city.allergens[s].map(a=>`<span class="allergen-tag">${a}</span>`).join("");
      document.getElementById("modal-tips").innerHTML="<h4>防护建议</h4><p>"+city.tips+"</p>";
      document.getElementById("city-modal").classList.add("active");
      
      // 地图定位到该城市
      const coords = cityCoords[n];
      if (coords && map) {
        map.setView(coords, 8);
      }
    }

    function closeModal(){
      document.getElementById("city-modal").classList.remove("active");
    }

    // 初始化
    document.getElementById("current-date").textContent="数据更新时间："+new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
    initMonthControls();
    updateMap(new Date().getMonth()+1);
    
    // Modal 点击背景关闭
    document.getElementById("city-modal").onclick=function(e){
      if(e.target===this)closeModal()
    };
  </script>
</body>
</html>
