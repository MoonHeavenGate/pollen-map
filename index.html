<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国过敏风险地图</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f5f7fa;min-height:100vh;color:#333}
    .header{background:#fff;padding:15px 20px;box-shadow:0 2px 8px rgba(0,0,0,0.1);position:sticky;top:0;z-index:100}
    .header h1{font-size:18px;color:#333;text-align:center}
    .season-badge{display:inline-block;background:linear-gradient(135deg,#4CAF50,#8BC34A);color:#fff;padding:4px 16px;border-radius:20px;font-size:12px;margin-top:8px;text-align:center}
    .controls{display:flex;justify-content:center;gap:10px;padding:15px;background:#fff;border-bottom:1px solid #eee}
    .month-btn{padding:8px 16px;border:2px solid #4CAF50;background:transparent;color:#4CAF50;border-radius:20px;cursor:pointer;font-size:13px;transition:all .3s}
    .month-btn:hover,.month-btn.active{background:#4CAF50;color:#fff}
    .container{padding:15px;max-width:800px;margin:0 auto}
    .map-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08);margin-bottom:15px}
    .map-header{padding:12px 16px;background:#f8f9fa;border-bottom:1px solid #eee;font-size:14px;color:#666}
    #map{height:450px;background:#e8f4f8}
    .legend{padding:16px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px}
    .legend-item{display:flex;align-items:center;gap:6px;font-size:12px}
    .legend-dot{width:12px;height:12px;border-radius:50%}
    .info-card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,0.08);margin-bottom:15px}
    .info-card h3{font-size:15px;margin-bottom:12px;color:#333;border-bottom:1px solid #eee;padding-bottom:8px}
    .allergen-list{display:flex;flex-wrap:wrap;gap:8px}
    .allergen-tag{background:#FFF8E1;border:1px solid #FFECB3;color:#F57C00;padding:6px 12px;border-radius:20px;font-size:12px;display:flex;align-items:center;gap:4px}
    .allergen-tag .icon{font-size:14px}
    .city-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .city-chip{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#f8f9fa;border-radius:10px;font-size:13px}
    .city-chip .name{font-weight:500}
    .city-chip .risk{padding:3px 10px;border-radius:12px;font-size:11px;color:#fff}
    .risk-0{background:#4CAF50}
    .risk-1{background:#FFC107;color:#333!important}
    .risk-2{background:#FF9800}
    .risk-3{background:#f44336}
    .footer{text-align:center;padding:20px;color:#999;font-size:12px}
    .leaflet-container{background:#e8f4f8}
    .loading{text-align:center;padding:50px;color:#999}
    @media(max-width:480px){.container{padding:10px}.city-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="header">
    <h1>🌸 全国过敏风险地图</h1>
    <div style="text-align:center"><span class="season-badge" id="season-badge">春季 (3-5月)</span></div>
  </div>
  <div class="controls" id="month-controls"></div>
  <div class="container">
    <div class="map-card">
      <div class="map-header">📍 点击省份查看详情</div>
      <div id="map"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#4CAF50"></div><span>低风险</span></div>
        <div class="legend-item"><div class="legend-dot" style="background:#FFC107"></div><span>中风险</span></div>
        <div class="legend-item"><div class="legend-dot" style="background:#FF9800"></div><span>高风险</span></div>
        <div class="legend-item"><div class="legend-dot" style="background:#f44336"></div><span>极高风险</span></div>
      </div>
    </div>
    
    <div class="info-card">
      <h3>🌿 主要过敏原</h3>
      <div class="allergen-list" id="allergen-list"></div>
    </div>
    
    <div class="info-card">
      <h3>🏙️ 主要城市风险</h3>
      <div class="city-grid" id="city-grid"></div>
    </div>
  </div>
  <div class="footer">
    <p>数据来源：基于气象监测和医学研究 | ⚠️ 仅供参考</p>
  </div>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    // 季节过敏原
    const pollenCalendar={
      spring:{name:"春季 (3-5月)",allergens:["🌳 杨树/柳树花粉","🌲 柏树花粉","🌸 法国梧桐","🍃 桦树花粉"],color:"#4CAF50"},
      summer:{name:"夏季 (6-8月)",allergens:["🌾 草本花粉","🌻 向日葵花粉","🍂 蝉翼过敏","🍄 霉菌孢子"],color:"#FF9800"},
      fall:{name:"秋季 (9-11月)",allergens:["🌿 蒿草花粉","🍁 葎草花粉","🌾 豚草花粉","🍄 霉菌孢子"],color:"#FF5722"},
      winter:{name:"冬季 (12-2月)",allergens:["🏠 室内尘螨","🍄 霉菌","🐛 宠物皮屑","🦠 室内细菌"],color:"#607D8B"}
    };
    
    // 城市风险数据（用于显示在城市列表）
    const cityRisk={
      "北京市":[3,"杨树/柳树花粉、柏树花粉"],"天津市":[3,"杨树/柳树花粉、梧桐花粉"],"石家庄市":[3,"杨树/柳树花粉、柏树花粉"],
      "太原市":[2,"杨树/柳树花粉、柏树花粉"],"呼和浩特":[2,"杨树/柳树花粉、草本花粉"],"沈阳市":[2,"柏树/杨树/桦树花粉"],
      "长春市":[2,"桦树/赤杨/柏树花粉"],"哈尔滨市":[2,"桦树/赤杨/柏树花粉"],"上海市":[2,"柏树/杨树花粉"],
      "南京市":[2,"柏树/杨树/梧桐花粉"],"杭州市":[2,"柏树/杨树/梧桐花粉"],"合肥市":[2,"柏树/杨树/梧桐花粉"],
      "福州市":[1,"螨虫、霉菌"],"厦门市":[1,"螨虫、霉菌"],"南昌市":[2,"柏树/杨树/梧桐花粉"],
      "济南市":[3,"杨树/柳树花粉、柏树花粉"],"青岛市":[2,"柏树/杨树/梧桐花粉"],"郑州市":[2,"杨树/柳树花粉、柏树花粉"],
      "武汉市":[2,"柏树/杨树/梧桐花粉"],"长沙市":[2,"柏树/杨树/梧桐花粉"],"广州市":[1,"螨虫、蟑螂抗原"],
      "深圳市":[1,"螨虫、霉菌"],"南宁市":[1,"螨虫、霉菌"],"海口市":[1,"螨虫、霉菌"],
      "重庆市":[2,"柏树/杨树花粉"],"成都市":[2,"柏树/杨树花粉"],"贵阳市":[1,"螨虫/霉菌"],
      "昆明市":[0,"螨虫、霉菌"],"拉萨市":[1,"杨树/柳树/沙棘花粉"],"西安市":[2,"柏树/杨树/沙枣花粉"],
      "兰州市":[2,"杨树/柳树花粉、草本花粉"],"西宁市":[1,"草本花粉、霉菌"],"银川市":[1,"草本花粉、霉菌"],
      "乌鲁木齐":[2,"杨树/柳树/榆树花粉"],"大连市":[2,"柏树/杨树/梧桐花粉"],"宁波市":[1,"螨虫、霉菌"],
      "温州市":[1,"螨虫、霉菌"],"珠海市":[1,"螨虫、霉菌"],"东莞市":[1,"螨虫、霉菌"]
    };
    
    // 省份风险映射（adcode前2位对应省份）
    const provinceRisk={
      "11":[3,"北京"],"12":[2,"天津"],"13":[3,"河北"],"14":[2,"山西"],"15":[2,"内蒙古"],
      "21":[2,"辽宁"],"22":[2,"吉林"},"23":[2,"黑龙江"],
      "31":[2,"上海"},"32":[2,"江苏"},"33":[1,"浙江"},"34":[2,"安徽"],"35":[1,"福建"],"36":[2,"江西"],"37":[3,"山东"],
      "41":[2,"河南"],"42":[2,"湖北"},"43":[2,"湖南"],"44":[1,"广东"],"45":[1,"广西"],"46":[1,"海南"],
      "50":[2,"重庆"],"51":[2,"四川"},"52":[1,"贵州"],"53":[1,"云南"],
      "54":[1,"西藏"],
      "61":[2,"陕西"],"62":[2,"甘肃"],"63":[1,"青海"],"64":[1,"宁夏"],"65":[2,"新疆"],
      "71":[1,"台湾"],"81":[0,"香港"],"82":[0,"澳门"]
    };
    
    const riskColors={0:"#4CAF50",1:"#FFC107",2:"#FF9800",3:"#f44336"};
    const riskLabels={0:"低风险",1:"中风险",2:"高风险",3:"极高风险"};
    
    const riskStyle=feature=>{
      const adcode=String(feature.properties.adcode);
      const provCode=adcode.substring(0,2);
      let riskLevel=0;
      if(provinceRisk[provCode])riskLevel=provinceRisk[provCode][0];
      return{
        fillColor:riskColors[riskLevel],
        fillOpacity:0.6,
        color:"#fff",
        weight:1.5
      };
    };
    
    let map,geoLayer;
    const monthNames=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
    
    function getSeason(m){if(m>=3&&m<=5)return"spring";if(m>=6&&m<=8)return"summer";if(m>=9&&m<=11)return"fall";return"winter"}
    
    function initMap(){
      map=L.map("map",{center:[35.86,104.19],zoom:4,minZoom:4,maxZoom:7});
      L.tileLayer("https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}",{
        subdomains:"1234",attribution:"&copy; 高德地图"
      }).addTo(map);
      
      fetch("https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json")
        .then(r=>r.json())
        .then(geojson=>{
          geoLayer=L.geoJSON(geojson,{style:riskStyle,onEachFeature:(f,l)=>{
            l.on("click",()=>showProvinceInfo(f.properties));
            l.on("mouseover",e=>e.target.setStyle({fillOpacity:0.8,weight:3}));
            l.on("mouseout",e=>geoLayer.resetStyle(e.target));
          }}).addTo(map);
          updateUI(new Date().getMonth()+1);
        })
        .catch(e=>{console.error("地图加载失败:",e);document.getElementById("map").innerHTML='<div class="loading">地图加载失败，请刷新</div>';});
    }
    
    function showProvinceInfo(props){
      const adcode=String(props.adcode);
      const provCode=adcode.substring(0,2);
      const provName=provinceRisk[provCode]?provinceRisk[provCode][1]:props.name;
      let riskLevel=0,allergens="暂无数据";
      if(provinceRisk[provCode]){
        riskLevel=provinceRisk[provCode][0];
        const s=getSeason(new Date().getMonth()+1);
        allergens=pollenCalendar[s].allergens.slice(0,3).join("、");
      }
      const info=`
        <div style="text-align:center;min-width:180px">
          <strong style="font-size:16px">${provName}</strong><br>
          <span style="display:inline-block;padding:4px 14px;background:${riskColors[riskLevel]};color:#fff;border-radius:14px;margin-top:6px;font-weight:bold">${riskLabels[riskLevel]}</span>
          <p style="color:#666;font-size:12px;margin-top:8px">主要过敏原：${allergens}</p>
        </div>
      `;
      geoLayer.bindPopup(info).openPopup();
    }
    
    function initMonthControls(){
      const c=document.getElementById("month-controls");
      const cm=new Date().getMonth()+1;
      monthNames.forEach((n,i)=>{
        const b=document.createElement("button");
        b.className="month-btn"+(i+1===cm?" active":"");
        b.textContent=n;
        b.onclick=()=>{
          document.querySelectorAll(".month-btn").forEach(x=>x.classList.remove("active"));
          b.classList.add("active");
          updateUI(i+1);
        };
        c.appendChild(b);
      });
    }
    
    function updateUI(m){
      const s=getSeason(m);
      const cal=pollenCalendar[s];
      document.getElementById("season-badge").textContent=cal.name;
      document.getElementById("season-badge").style.background=`linear-gradient(135deg,${cal.color},${cal.color}aa)`;
      
      // 过敏原
      document.getElementById("allergen-list").innerHTML=cal.allergens.map(a=>`
        <span class="allergen-tag"><span class="icon">${a.split(" ")[0]}</span>${a.split(" ")[1]}</span>
      `).join("");
      
      // 城市列表
      const cities=Object.entries(cityRisk).map(([n,[r,a]])=>({name:n,risk:r,allergens:a}))
        .sort((a,b)=>b.risk-a.risk).slice(0,12);
      document.getElementById("city-grid").innerHTML=cities.map(c=>`
        <div class="city-chip">
          <span class="name">${c.name}</span>
          <span class="risk risk-${c.risk}">${riskLabels[c.risk]}</span>
        </div>
      `).join("");
      
      // 更新地图颜色
      if(geoLayer)geoLayer.setStyle(riskStyle);
    }
    
    initMap();
    initMonthControls();
  </script>
</body>
</html>
